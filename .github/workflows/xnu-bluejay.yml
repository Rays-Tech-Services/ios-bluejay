name: xnu-bluejay

# Builds the Pixel 6a kernel: xnu-8796.141.3 + ios-sweet patches 0001-0081
# + the iOS16-on-A40 port + kernel/0001-bluejay-port.patch, with
# SWEET_BOARD=BLUEJAY (ARMv8.2 flags, bluejay framebuffer constants).
# Same runner and build script as ios-sweet's .github/workflows/xnu.yml.

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/xnu-bluejay.yml"

concurrency:
  group: xnu-bluejay-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  SWEET_REPO: https://github.com/dipa-studio/ios-sweet
  SWEET_SHA: 11da58bd050672960c0a83b5bef2176047eea479
  A40_REPO: https://github.com/tlfares/iOS16-on-A40
  A40_SHA: 43261beae00b46b64ecceef20a075c916f78b8b1
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: SWEET
  SWEET_BOARD: BLUEJAY

jobs:
  build:
    # Xcode 15 (macos-14): its iig matches the xnu-8796 IORPC ABI, so the
    # A40 port's 0000-xcode-iig patch (for Xcode 16) is not applied.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and the patch series
        run: |
          fetch() { git init -q "$1"; git -C "$1" fetch -q --depth 1 "$2" "$3"; git -C "$1" checkout -q FETCH_HEAD; }
          fetch dxb "$DXB_REPO" "$DXB_SHA"
          fetch sweet "$SWEET_REPO" "$SWEET_SHA"
          fetch a40 "$A40_REPO" "$A40_SHA"
          cp sweet/xnu/patches/*.patch sweet/xnu/patches/*.sh dxb/patches/
          # applied after sweet's 0001-0081, in this order
          cp a40/kernel/0001-a40-port.patch dxb/patches/0900-a40-port.patch
          cp kernel/0001-bluejay-port.patch dxb/patches/0901-bluejay-port.patch
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Check the build flags
        if: always()
        run: |
          K=$(ls dxb/fakeroot/System/Library/Kernels/kernel.*sweet* 2>/dev/null | grep -v dSYM | head -1)
          [ -n "$K" ] || { echo "no kernel built"; exit 1; }
          # bluejay framebuffer constant must be in the early boot code
          xcrun llvm-objdump -d "$K" | grep -c 'fac0' || echo "warning: 0xfac0xxxx not found in disassembly"

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-bluejay
          path: out/
          if-no-files-found: warn
